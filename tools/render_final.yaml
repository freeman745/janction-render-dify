identity:
  name: render_final
  author: jasmylab
  label:
    en_US: Render final
    zh_Hans: 正式渲染
    ja_JP: 本番レンダリング
description:
  human:
    en_US: 'Render the final frames or video (PNG / EXR / MP4). Uses GPU time: estimate and confirm first.'
    zh_Hans: 渲染最终的帧或视频（PNG / EXR / MP4）。会消耗 GPU 时间：请先估算并确认。
  llm: 'Start the final render (frames or MP4) on cloud GPUs. Only after the user has seen a preview and agreed
    to the estimate from render_estimate. max_yen caps the cost: 0 (default) renders only if it fits the free GPU
    time. Returns a job_id; long renders keep running after this call: check with render_status.'
parameters:
- name: scene_file
  type: file
  required: false
  label:
    en_US: Scene file
    zh_Hans: 场景文件
  human_description:
    en_US: A .blend, a Blender Python script or a 3D file (GLB, FBX, USD, OBJ, STL...), up to 100 MB.
    zh_Hans: Blender 文件（.blend）、Blender Python 脚本或 3D 文件（GLB、FBX、USD、OBJ、STL 等），最大 100 MB。
  llm_description: 'The scene to render: a .blend, a Blender Python script (.py) or a 3D file (GLB, glTF, FBX, USD,
    OBJ, STL, PLY, Alembic), up to 100 MB. Give this, or scene_id, scene_url or scene_script.'
  form: llm
- name: scene_id
  type: string
  required: false
  label:
    en_US: Scene ID
    zh_Hans: 场景 ID
  human_description:
    en_US: The scene_id of an earlier job, to render the same scene again.
    zh_Hans: 之前任务的 scene_id，用来再次渲染同一个场景。
  llm_description: scene_id from an earlier job (f_...), to render the same scene again without sending it.
  form: llm
- name: scene_url
  type: string
  required: false
  label:
    en_US: Scene URL
    zh_Hans: 场景链接
  human_description:
    en_US: An https link to a .blend, .py or 3D file.
    zh_Hans: 指向 .blend、.py 或 3D 文件的 https 链接。
  llm_description: An https link to a .blend, .py or 3D file (use this for files over 100 MB).
  form: llm
- name: scene_script
  type: string
  required: false
  label:
    en_US: Scene script (bpy)
    zh_Hans: 场景脚本（bpy）
  human_description:
    en_US: Blender Python (bpy) code that builds the scene.
    zh_Hans: 用 Blender Python（bpy）代码搭建场景。
  llm_description: 'The scene as Blender 5 Python (bpy) code that builds it from an empty file: objects, materials,
    lights and a camera. Used when no file, scene_id or scene_url is given.'
  form: llm
- name: asset_urls
  type: string
  required: false
  label:
    en_US: Asset URLs
    zh_Hans: 素材链接
  human_description:
    en_US: 'Extra files for the script, comma separated: https links or polyhaven:<id>.'
    zh_Hans: 脚本要用的额外文件，用逗号分隔：https 链接或 polyhaven:<id>。
  llm_description: 'Extra files for scene_script / scene_url, comma separated: https links or ''polyhaven:<id>''
    CC0 assets from asset_search (load them in the script with jr_assets).'
  form: llm
- name: frame_start
  type: number
  required: false
  label:
    en_US: First frame
    zh_Hans: 起始帧
  human_description:
    en_US: 'First frame to render (default: the scene''s).'
    zh_Hans: 起始帧
  llm_description: 'First frame to render (default: the scene''s).'
  form: llm
- name: frame_end
  type: number
  required: false
  label:
    en_US: Last frame
    zh_Hans: 结束帧
  human_description:
    en_US: 'Last frame to render; up to 3,000 frames per call (default: the scene''s).'
    zh_Hans: 结束帧
  llm_description: 'Last frame to render; up to 3,000 frames per call (default: the scene''s).'
  form: llm
- name: width
  type: number
  required: false
  label:
    en_US: Width
    zh_Hans: 宽度
  human_description:
    en_US: 'Width in pixels: up to 1920 on free time, 3840 with prepaid credit.'
    zh_Hans: 宽度
  llm_description: 'Width in pixels: up to 1920 on free time, 3840 with prepaid credit.'
  form: llm
- name: height
  type: number
  required: false
  label:
    en_US: Height
    zh_Hans: 高度
  human_description:
    en_US: 'Height in pixels: up to 1080 on free time, 2160 with prepaid credit.'
    zh_Hans: 高度
  llm_description: 'Height in pixels: up to 1080 on free time, 2160 with prepaid credit.'
  form: llm
- name: samples
  type: number
  required: false
  label:
    en_US: Samples
    zh_Hans: 采样数
  human_description:
    en_US: 'Cycles samples per pixel (default: chosen by the service).'
    zh_Hans: 采样数
  llm_description: 'Cycles samples per pixel (default: chosen by the service).'
  form: llm
- name: fps
  type: number
  required: false
  label:
    en_US: FPS
    zh_Hans: 帧率
  human_description:
    en_US: 'Frames per second of the video (default: the scene''s).'
    zh_Hans: 帧率
  llm_description: 'Frames per second of the video (default: the scene''s).'
  form: llm
- name: output
  type: select
  required: false
  label:
    en_US: Output
    zh_Hans: 输出格式
  human_description:
    en_US: auto = PNG for one frame, MP4 for an animation; or png, exr, mp4, webm, prores, gif, webp.
    zh_Hans: 输出格式
  llm_description: auto = PNG for one frame, MP4 for an animation; or png, exr, mp4, webm, prores, gif, webp.
  form: llm
  options:
  - value: auto
    label:
      en_US: Auto
      zh_Hans: 自动
  - value: png
    label:
      en_US: PNG
      zh_Hans: PNG
  - value: mp4
    label:
      en_US: MP4
      zh_Hans: MP4
  - value: webm
    label:
      en_US: WebM
      zh_Hans: WebM
  - value: exr
    label:
      en_US: OpenEXR
      zh_Hans: OpenEXR
  - value: prores
    label:
      en_US: ProRes
      zh_Hans: ProRes
  - value: gif
    label:
      en_US: GIF
      zh_Hans: GIF
  - value: webp
    label:
      en_US: WebP
      zh_Hans: WebP
- name: preset
  type: select
  required: false
  label:
    en_US: Preset
    zh_Hans: 预设
  human_description:
    en_US: product = studio product shots, turntable = 360-degree turntable, animation = the scene's own frame range.
    zh_Hans: 预设
  llm_description: product = studio product shots, turntable = 360-degree turntable, animation = the scene's own
    frame range.
  form: llm
  options:
  - value: none
    label:
      en_US: None
      zh_Hans: 无
  - value: product
    label:
      en_US: Product shots
      zh_Hans: 产品棚拍
  - value: turntable
    label:
      en_US: 360° turntable
      zh_Hans: 360 度转台
  - value: animation
    label:
      en_US: Animation
      zh_Hans: 动画
- name: environment
  type: select
  required: false
  label:
    en_US: Lighting
    zh_Hans: 环境光
  human_description:
    en_US: 'Add HDRI lighting: studio, sunset, overcast or night; compare renders the four side by side (preview).'
    zh_Hans: 环境光
  llm_description: 'Add HDRI lighting: studio, sunset, overcast or night; compare renders the four side by side
    (preview).'
  form: llm
  options:
  - value: none
    label:
      en_US: Scene's own
      zh_Hans: 场景自带
  - value: studio
    label:
      en_US: Studio
      zh_Hans: 影棚
  - value: sunset
    label:
      en_US: Sunset
      zh_Hans: 日落
  - value: overcast
    label:
      en_US: Overcast
      zh_Hans: 阴天
  - value: night
    label:
      en_US: Night
      zh_Hans: 夜晚
  - value: compare
    label:
      en_US: Compare all
      zh_Hans: 全部对比
- name: engine
  type: select
  required: false
  label:
    en_US: Engine
    zh_Hans: 渲染引擎
  human_description:
    en_US: cycles (default, path tracing) or eevee (faster, real time).
    zh_Hans: 渲染引擎
  llm_description: cycles (default, path tracing) or eevee (faster, real time).
  form: llm
  options:
  - value: none
    label:
      en_US: Default
      zh_Hans: 默认
  - value: cycles
    label:
      en_US: Cycles
      zh_Hans: Cycles
  - value: eevee
    label:
      en_US: EEVEE
      zh_Hans: EEVEE
- name: camera
  type: string
  required: false
  label:
    en_US: Camera
    zh_Hans: 相机
  human_description:
    en_US: 'Name of the camera object to render from (default: the scene camera).'
    zh_Hans: 相机
  llm_description: 'Name of the camera object to render from (default: the scene camera).'
  form: llm
- name: transparent
  type: boolean
  required: false
  label:
    en_US: Transparent background
    zh_Hans: 透明背景
  human_description:
    en_US: Render with a transparent background (PNG with alpha).
    zh_Hans: 透明背景
  llm_description: Render with a transparent background (PNG with alpha).
  form: llm
- name: max_yen
  type: number
  required: false
  label:
    en_US: Max cost (JPY)
    zh_Hans: 费用上限（日元）
  human_description:
    en_US: The most this render may cost in JPY. 0 = only if it fits the free GPU time.
    zh_Hans: 费用上限（日元）
  llm_description: The most this render may cost in JPY. 0 = only if it fits the free GPU time.
  form: llm
  default: 0
- name: wait_seconds
  type: number
  required: false
  label:
    en_US: Wait (seconds)
    zh_Hans: 等待（秒）
  human_description:
    en_US: 'How long to wait for the job before returning (0-200). Finals usually take longer: leave 0 and check
      with render_status.'
    zh_Hans: 等待（秒）
  llm_description: 'How long to wait for the job before returning (0-200). Finals usually take longer: leave 0 and
    check with render_status.'
  form: llm
  default: 0
extra:
  python:
    source: tools/render_final.py
