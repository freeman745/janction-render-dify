  zh_Hans: 在云端 GPU 上渲染 Blender 场景和 3D 模型（GLB、FBX、USD、OBJ、STL）。几秒出预览，附带问题点评和 bpy 修复代码；确认后渲染成片或 MP4。无需本地 GPU 和 Blender。
  ja_JP: Blender のシーンや 3D モデル（GLB、FBX、USD、OBJ、STL）をクラウド GPU でレンダリングします。数秒でプレビューと講評・bpy の修正案、確認後に本番フレームや MP4。手元の GPU や Blender は不要です。
